[package]
name = "crosspuck-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight macOS audio-output following for CrossOver"
default-run = "CrossPuck"

[[bin]]
name = "CrossPuck"
path = "src/main.rs"

[build-dependencies]
cc = "1.2"

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSImage",
    "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSButton", "NSControl",
    "NSCell", "NSView", "NSRunningApplication", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSAutoreleasePool", "NSLocale", "NSNotification", "NSObject",
    "NSString", "NSThread", "NSUserDefaults",
] }
