[workspace]
members = ["crates/crosspuck-app"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
authors = ["scryner <scryner@gmail.com>"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

# Avoid the macOS 27 build-time proc-macro alignment issue on older LLVM.
[profile.release.build-override]
strip = "none"
